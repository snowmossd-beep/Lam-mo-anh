<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chỉnh độ nét video by VennLMAO</title>
<style>
:root{--bg:#f4f5f7;--fg:#15171a;--card:#fff;--ac:#4f46e5;--mu:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--fg:#eceef2;--card:#1b1e24;--ac:#818cf8;--mu:#9aa1ad}}
:root[data-theme="dark"]{--bg:#111317;--fg:#eceef2;--card:#1b1e24;--ac:#818cf8;--mu:#9aa1ad}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stage{background:#000;border-radius:10px;min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{max-width:100%;max-height:60vh;display:none}
.hint{color:var(--mu);font-size:14px}
label.btn,button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
button:disabled{opacity:.5}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.val{font-size:28px;font-weight:700;text-align:center}
.tag{text-align:center;color:var(--mu);font-size:14px}
.num{width:90px;flex:none;padding:10px;border-radius:8px;border:1px solid var(--mu);background:var(--bg);color:var(--fg);font-size:16px;text-align:center}
video.out{width:100%;border-radius:10px;display:none}
a.dl{display:none;color:var(--ac);font-weight:600;text-align:center}
</style>
</head>
<body>
<main>
<h1>Chỉnh độ nét video</h1>
<div class="card">
<div class="stage"><span class="hint" id="ph">Chưa chọn video</span><canvas id="cv"></canvas></div>
<label class="btn">Chọn video<input type="file" id="f" accept="video/*"></label>
<div class="row"><button class="sec" id="pp" disabled>Phát / Dừng</button><button class="sec" id="rs" disabled>Về đầu</button></div>
</div>
<div class="card">
<div class="val" id="v">100</div>
<div class="tag" id="t">Gốc</div>
<input type="range" id="r" min="1" max="200" value="100">
<div class="row"><span class="hint">1 = mờ nhất</span><span class="hint" style="text-align:center">100 = gốc</span><span class="hint" style="text-align:right">200 = nét nhất</span></div>
<div class="row"><input class="num" id="n" type="number" min="1" max="200" value="100"><button class="sec" id="z">Đặt lại 100</button></div>
</div>
<div class="card">
<button id="ex" disabled>Xuất video đã chỉnh</button>
<div class="hint" id="st"></div>
<video class="out" id="o" controls playsinline></video>
<a class="dl" id="dl">Tải video</a>
</div>
</main>
<script>
const $=i=>document.getElementById(i);
const cv=$('cv'),gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const vid=document.createElement('video');
vid.playsInline=true;vid.setAttribute('playsinline','');vid.setAttribute('webkit-playsinline','');vid.preload='auto';vid.muted=true;vid.loop=false;
let level=100,ready=false,exporting=false,url=null;

const vs='attribute vec2 p;varying vec2 u;void main(){u=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;varying vec2 u;uniform sampler2D t;uniform vec2 px;uniform float v;
vec3 g(float s){
vec3 c=texture2D(t,u).rgb*4.;
c+=texture2D(t,u+vec2(px.x,0.)*s).rgb*2.;
c+=texture2D(t,u-vec2(px.x,0.)*s).rgb*2.;
c+=texture2D(t,u+vec2(0.,px.y)*s).rgb*2.;
c+=texture2D(t,u-vec2(0.,px.y)*s).rgb*2.;
c+=texture2D(t,u+px*s).rgb;
c+=texture2D(t,u-px*s).rgb;
c+=texture2D(t,u+vec2(px.x,-px.y)*s).rgb;
c+=texture2D(t,u+vec2(-px.x,px.y)*s).rgb;
return c/16.;}
vec3 b(float s){
float sc=max(1./px.x,1./px.y)/1080.;
float h=fract(sin(dot(u*1000.,vec2(12.9898,78.233)))*43758.5453);
vec2 j=(vec2(h,fract(h*7.13))-.5)*s*sc*.8;
vec3 a=vec3(0.);float w=0.;
for(int i=-3;i<=3;i++){for(int k=-3;k<=3;k++){
float f=exp(-float(i*i+k*k)/6.);
a+=texture2D(t,u+(vec2(float(i),float(k))*s*sc+j)*px*1.).rgb*f;w+=f;}}
return a/w;}
vec3 m(float d){
float sc=max(1./px.x,1./px.y)/1080.;
float bs=1.+d*d*9.*sc;
vec2 q=(floor(u/(px*bs))+.5)*px*bs;
vec3 a=vec3(0.);float w=0.;
for(int i=-2;i<=2;i++){for(int k=-2;k<=2;k++){
float f=exp(-float(i*i+k*k)/3.);
a+=texture2D(t,q+vec2(float(i),float(k))*px*bs*(.8+d)).rgb*f;w+=f;}}
vec3 c=a/w;
float l=dot(c,vec3(.299,.587,.114));
vec3 cc=texture2D(t,q+vec2(3.,2.)*px*bs*d).rgb;
float lc=dot(cc,vec3(.299,.587,.114));
c=vec3(l)+(cc-vec3(lc))*.7+(c-vec3(l))*.3;
float lv=mix(256.,26.,d);
c=floor(c*lv+.5)/lv;
return mix(vec3(l),c,1.-d*.25);}
void main(){
vec3 o=texture2D(t,u).rgb;
vec3 c=o;
if(v>100.){
float t=(v-100.)/100.;
vec3 fine=clamp(o-g(1.),-.5,.5);
vec3 mid=clamp(o-b(1.+t*3.),-.5,.5);
c=o+fine*t*6.+mid*t*1.8;
float l=dot(c,vec3(.299,.587,.114));
c=mix(vec3(l),c,1.+t*.4);
c=(c-.5)*(1.+t*.3)+.5;
}else if(v<100.){
float d=(100.-v)/99.;
c=mix(o,m(d),clamp(d*10.,0.,1.));
}
gl_FragColor=vec4(clamp(c,0.,1.),1.);}`;

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
const pg=gl.createProgram();
gl.attachShader(pg,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pg);gl.useProgram(pg);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
const uPx=gl.getUniformLocation(pg,'px'),uV=gl.getUniformLocation(pg,'v');

function draw(){
if(!ready)return;
gl.viewport(0,0,cv.width,cv.height);
gl.bindTexture(gl.TEXTURE_2D,tx);
try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid)}catch(e){return}
gl.uniform2f(uPx,1/cv.width,1/cv.height);
gl.uniform1f(uV,level);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function loop(){draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function label(){
$('v').textContent=level;
$('t').textContent=level==100?'Gốc':level<100?'Giảm nét (làm mờ)':'Tăng nét';
}
function setLevel(x){
x=Math.max(1,Math.min(200,Math.round(Number(x)||100)));
level=x;$('r').value=x;$('n').value=x;label();draw();
}
$('r').oninput=e=>setLevel(e.target.value);
$('n').onchange=e=>setLevel(e.target.value);
$('z').onclick=()=>setLevel(100);

$('f').onchange=e=>{
const f=e.target.files[0];if(!f)return;
if(url)URL.revokeObjectURL(url);
url=URL.createObjectURL(f);
vid.src=url;ready=false;
$('ph').style.display='block';$('ph').textContent='Đang tải video...';
vid.onerror=()=>{$('ph').style.display='block';$('ph').textContent='Không đọc được video này (định dạng không hỗ trợ).'};
vid.load();
const init=()=>{
if(ready||!vid.videoWidth)return;
let w=vid.videoWidth,h=vid.videoHeight;
const m=1920,sc=Math.min(1,m/Math.max(w,h));
cv.width=Math.round(w*sc/2)*2;cv.height=Math.round(h*sc/2)*2;
cv.style.display='block';$('ph').style.display='none';
ready=true;
['pp','rs','ex'].forEach(i=>$(i).disabled=false);
vid.currentTime=0;draw();
};
vid.onloadedmetadata=init;vid.onloadeddata=init;vid.oncanplay=init;
};
$('pp').onclick=()=>{vid.muted=false;vid.paused?vid.play():vid.pause()};
$('rs').onclick=()=>{vid.pause();vid.currentTime=0;setTimeout(draw,100)};

$('ex').onclick=async()=>{
if(!ready||exporting)return;
if(!window.MediaRecorder){$('st').textContent='Trình duyệt không hỗ trợ xuất video.';return}
exporting=true;$('ex').disabled=true;
vid.pause();vid.currentTime=0;
await new Promise(r=>setTimeout(r,200));
const cs=cv.captureStream(30);
try{
const as=(vid.captureStream?vid.captureStream():vid.mozCaptureStream?vid.mozCaptureStream():null);
if(as)as.getAudioTracks().forEach(t=>cs.addTrack(t));
}catch(e){}
const types=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
const mt=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
const rec=new MediaRecorder(cs,mt?{mimeType:mt,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000});
const chunks=[];
rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
const done=new Promise(r=>rec.onstop=r);
const tick=setInterval(()=>{$('st').textContent='Đang xuất... '+Math.round(vid.currentTime/vid.duration*100)+'%'},300);
vid.onended=()=>{if(rec.state!=='inactive')rec.stop()};
rec.start(500);
vid.muted=false;
await vid.play();
await done;
clearInterval(tick);
vid.onended=null;
const type=rec.mimeType||'video/webm';
const blob=new Blob(chunks,{type});
const ou=URL.createObjectURL(blob);
const o=$('o');o.src=ou;o.style.display='block';
const a=$('dl');a.href=ou;a.download='video-chinh-net.'+(type.includes('mp4')?'mp4':'webm');a.style.display='block';
$('st').textContent='Xong. Nhấn giữ video để lưu nếu nút tải không hoạt động.';
exporting=false;$('ex').disabled=false;
};
label();
</script>
</body>
</html>
